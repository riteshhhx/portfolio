<!DOCTYPE html>
<html lang="en">
<head>
  </head>
<body>
  <script>
  (function runWhenReady(){
    function main(){

      // 1. Footer year
      (function(){
        const yEl = document.getElementById('y');
        if(yEl) yEl.textContent = new Date().getFullYear();
      })();

      // 2. Smooth anchor scrolling
      document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
          const id = a.getAttribute('href');
          if(id && id.length > 1){
             const target = document.querySelector(id);
             if(target) {
               e.preventDefault();
               target.scrollIntoView({behavior:'smooth'});
             }
          }
        });
      });

      // 3. Theme toggle (Fixed: Explicit class handling + Null checks)
      (function(){
        const key = 'theme-pref';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        const applyTheme = (mode) => {
          // Explicitly remove both first to ensure no conflicts, then add the current mode
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(mode);
          
          const btn = document.getElementById('themeToggle');
          if(btn){
            const isLight = mode === 'light';
            btn.setAttribute('aria-pressed', isLight);
            btn.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
            btn.textContent = isLight ? '☾' : '☀︎';
          }
          localStorage.setItem(key, mode);
        };

        const stored = localStorage.getItem(key);
        const initial = stored ? stored : (prefersDark ? 'dark' : 'light');
        applyTheme(initial);

        document.getElementById('themeToggle')?.addEventListener('click', () => {
          // Check current class to toggle
          const currentMode = document.documentElement.classList.contains('light') ? 'light' : 'dark';
          const next = currentMode === 'light' ? 'dark' : 'light';
          applyTheme(next);
        });
      })();

      // 4. Stats counter (Fixed: Removed observer delay for better fast-scroll performance)
      (function(){
        const stats = document.querySelectorAll('.stat');
        if(!('IntersectionObserver' in window) || stats.length === 0) return;
        
        const statObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if(entry.isIntersecting){
              const el = entry.target;
              const targetStr = el.getAttribute('data-target');
              const target = parseFloat(targetStr) || 0;
              
              const start = performance.now();
              const duration = 1200;
              
              function animate(now){
                const p = Math.min((now - start) / duration, 1);
                // Ease-out logic (optional, makes it smoother): 1 - Math.pow(1 - p, 3)
                const value = target * p;
                
                // If target is integer, show no decimals; otherwise show 1 decimal
                el.textContent = (target % 1 === 0) 
                  ? Math.round(value).toString() 
                  : value.toFixed(1);
                  
                if(p < 1) requestAnimationFrame(animate);
                else {
                    // Ensure final value is exact
                    el.textContent = (target % 1 === 0) ? target : target.toFixed(1);
                }
              }
              
              requestAnimationFrame(animate);
              el.classList.add('pulse');
              statObserver.unobserve(el);
            }
          });
        }, {threshold: 0.5});

        // Observe immediately, don't use setTimeout inside the loop
        stats.forEach(s => statObserver.observe(s));
      })();

      // [your other JS sections — typewriter, highlights, timeline, education %, reveal observers, parallax, etc.]

      /* ------------- ✅ Fallback Animation Script ------------- */
      // Ensures content becomes visible even if JS animations/observers fail or load too slowly
      (function(){
        try{
          setTimeout(() => {
            // Check if any critical elements have the 'show' class yet
            const anyShown = document.querySelectorAll('.card.show, .project.show, .avatar.show').length > 0;
            
            if(!anyShown){
              // Force show specific critical elements
              const elementsToForce = [
                  '.card', '.item', '.project', '.avatar', 'h2', 
                  '#about p', '#about li', '#experience .timeline'
              ];
              
              elementsToForce.forEach(selector => {
                  document.querySelectorAll(selector).forEach(el => el.classList.add('show'));
              });

              document.querySelectorAll('section').forEach(sec => sec.classList.add('show-underline'));
              
              // Handle Education Progress Bars manually if they haven't animated
              const progs = document.querySelectorAll('.edu-progress');
              progs.forEach(prog => {
                  const bar = prog.querySelector('.edu-progress-bar');
                  const val = prog.querySelector('.edu-progress-val');
                  const target = parseInt(prog.getAttribute('data-target'), 10) || 0;
                  if(bar) bar.style.width = target + '%';
                  if(val) val.textContent = target + '%';
              });
            }
          }, 800); // Increased slightly to 800ms to avoid conflict with natural load
        } catch(e){ console.warn('Fallback reveal script error', e); }
      })();
      /* -------------------------------------------------------------- */

    } // end main

    // Execution check
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main, {once: true});
    } else {
      main();
    }
  })();
  </script>
</body>
</html>
